version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgres_gestorvendas
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: gestordb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_gestorvendas
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gestor.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8081:80"

volumes:
  postgres_data:
